# Bac à sable du Pilote K52F (complète /etc/systemd/system/k52f-pilote.service).
# Possible depuis que le Pilote n'utilise plus sudo (droits précis donnés par polkit).
# Pour revenir en arrière : supprimer ce fichier, puis daemon-reload et restart.
[Service]
UMask=0077
# Interdit toute prise de droits (sudo, programmes setuid) depuis le Pilote et ses outils.
NoNewPrivileges=yes

# Lecture seule partout, sauf ce dont le Pilote et ses outils ont besoin :
ProtectSystem=strict
ProtectHome=read-only
# - son journal et l'état du tunnel Cloudflare
ReadWritePaths=-/home/utilisateur/.cache/k52f-pilote.log
ReadWritePaths=-/home/utilisateur/.cache/k52f-tunnel
# - sa configuration et le carnet de contacts
ReadWritePaths=-/home/utilisateur/.config/k52f
# - la mise à jour des sites de démo (git pull, npm install)
ReadWritePaths=/var/www/demo
ReadWritePaths=-/home/utilisateur/.npm

PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
# Le tunnel (cloudflared) a besoin de lire les interfaces réseau : AF_NETLINK.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
AmbientCapabilities=
MemoryMax=512M
