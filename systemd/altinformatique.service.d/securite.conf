# Bac à sable d'ALTinformatique (complète /etc/systemd/system/altinformatique.service).
# Installé dans /etc/systemd/system/altinformatique.service.d/securite.conf.
# Pour revenir en arrière : supprimer ce fichier, puis daemon-reload et restart.
[Service]
# Compte dédié, sans mot de passe ni shell : une faille dans l'appli ne donne plus accès
# au compte « utilisateur » (secrets de Sam, clé SSH, Google Drive, sudo…).
User=altinfo
Group=altinfo
UMask=0077

# L'appli n'écrit rien sur le disque : tout est en lecture seule, /home est invisible.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
ProcSubset=pid
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
CapabilityBoundingSet=
AmbientCapabilities=
# Pas de MemoryDenyWriteExecute : le moteur JavaScript de Node en a besoin.

# Ne pas mettre le K52F à genoux si l'appli s'emballe.
MemoryMax=512M
TasksMax=128
